<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prefix modes</title>
<style>
  body { margin: 0; padding: 8px; background: #111; color: #aaa; font: 12px system-ui, sans-serif; display: grid; grid-template-columns: repeat(3, 330px); gap: 10px; }
  figure { margin: 0; }
  figcaption { padding: 2px 4px 4px; }
  iframe { width: 320px; height: 300px; border: 1px solid #333; background: #181818; }
</style>
</head>
<body>
  <figure><figcaption>tree (default), indent 12</figcaption><iframe src="preview.html?prefix=tree"></iframe></figure>
  <figure><figcaption>tree, indent 24</figcaption><iframe src="preview.html?prefix=tree&amp;indent=24"></iframe></figure>
  <figure><figcaption>bullet + guide line</figcaption><iframe src="preview.html?prefix=bullet"></iframe></figure>
  <figure><figcaption>number</figcaption><iframe src="preview.html?prefix=number&amp;guide=0"></iframe></figure>
  <figure><figcaption>custom "»", ungrouped on top</figcaption><iframe src="preview.html?prefix=custom&amp;ungrouped=top"></iframe></figure>
  <figure><figcaption>arrow, no times, by name</figcaption><iframe src="preview.html?prefix=arrow&amp;time=0&amp;order=name"></iframe></figure>
</body>
</html>
