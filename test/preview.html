<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Claude csoportok – előnézet</title>
<!-- Browser preview of the webview with VS Code "Dark Modern" colors and a mock extension host. -->
<style>

    --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", system-ui, sans-serif;
    --vscode-font-size: 13px;
    --vscode-font-weight: normal;

    --vscode-descriptionForeground: #9d9d9d;
    --vscode-icon-foreground: #cccccc;
    --vscode-focusBorder: #0078d4;
    --vscode-sideBar-background: #181818;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-list-activeSelectionBackground: #04395e;
    --vscode-list-activeSelectionForeground: #ffffff;
    --vscode-list-inactiveSelectionBackground: #37373d;
    --vscode-list-focusOutline: #0078d4;
    --vscode-list-dropBackground: #383b3d;
    --vscode-list-dropBetweenBackground: #0078d4;
    --vscode-badge-background: #616161;
    --vscode-badge-foreground: #f8f8f8;
    --vscode-input-background: #313131;
    --vscode-input-foreground: #cccccc;
    --vscode-input-border: #3c3c3c;
    --vscode-input-placeholderForeground: #989898;
    --vscode-tree-indentGuidesStroke: #585858;
    --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
    --vscode-widget-border: #313131;
    --vscode-sideBarSectionHeader-border: #2b2b2b;
    --vscode-textLink-foreground: #4daafc;
    --vscode-charts-red: #f14c4c;
    --vscode-charts-orange: #d18616;
    --vscode-charts-yellow: #cca700;
    --vscode-charts-green: #89d185;
    --vscode-charts-blue: #3794ff;
    --vscode-charts-purple: #b180d7;
    --vscode-terminal-ansiBrightMagenta: #d670d6;
    --vscode-editor-findMatchHighlightBackground: rgba(234, 92, 0, 0.33);
    --vscode-editorWidget-background: #202020;
    --vscode-button-background: #0078d4;
    --vscode-button-foreground: #ffffff;
    --vscode-button-hoverBackground: #026ec1;
    --vscode-button-border: rgba(255, 255, 255, 0.07);
  }
  html { background: #181818; }
  html, body { width: var(--preview-width, 320px) !important; height: var(--preview-height, 520px) !important; }

<link rel="stylesheet" href="../media/view.css">
</head>
<body class="vscode-dark">
<div class="toolbar">
  <label class="search">
    <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="M10.25 10.25 13.5 13.5"/></svg>
    <input id="search" type="text" spellcheck="false" autocomplete="off">
    <button id="clear" class="icon-btn" type="button" hidden>
      <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
    </button>
  </label>
  <button id="newSession" class="new-session" type="button">
    <svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>
    <span class="label"></span>
  </button>
</div>
<div id="tree" role="tree" aria-multiselectable="true"></div>

<script>window.module = { exports: {} };</script>
<script src="../src/groupOps.js"></script>
<script>
  const ops = window.module.exports;
  const params = new URLSearchParams(location.search);
  const now = Date.now();
  const min = 60000;
  const session = (id, title, ago, extra) => Object.assign({ id, title, mtime: now - ago, createdAt: now - ago - 3600000, branch: 'main', prompt: undefined, worktree: false }, extra);
  const host = {
    log: [],
    savedState: undefined,
    state: {
      loading: false,
      workspace: 'claude-code-testing',
      ungroupedCollapsed: false,
      groups: [
        { id: 'g-docs', name: 'Dokumentáció', color: null, collapsed: false, sessionIds: ['s1', 's2'] },
        { id: 'g-test', name: 'Teszt', color: 'green', collapsed: false, sessionIds: ['s3'] },
        { id: 'g-idea', name: 'Ötletek', color: 'purple', collapsed: true, sessionIds: ['s4'] },
      ],
      sessions: [
        session('s1', 'YGX fájl dokumentáció', 125 * min),
        session('s2', 'Docs és bugs mappa létrehozása', 26 * 60 * min, { prompt: 'hozz létre egy docs és egy bugs mappát' }),
        session('s3', 'Unit tesztek a parserhez', 40 * min),
        session('s4', 'Bluetooth widget gyorsan', 3 * 24 * 60 * min),
        session('s5', 'Claude VS Code extension grouping', 0.5 * min),
        session('s6', 'ViewModel és slider javítás', 5 * 60 * min, { worktree: true }),
        session('s7', 'GTA 6 játék fejlesztés', 9 * 24 * 60 * min),
        session('s8', 'Útmutató hatékony kódolási instrukciókhoz', 50 * 24 * 60 * min),
      ],
      settings: {
        prefix: params.get('prefix') || 'tree',
        customPrefix: params.get('custom') || '»',
        indent: Number(params.get('indent') || 12),
        guide: params.get('guide') !== '0',
        timestamps: params.get('time') !== '0',
        order: params.get('order') || 'manual',
        ungrouped: params.get('ungrouped') || 'bottom',
        singleClick: true,
      },
    },
    ack: 0,
    latency: Number(params.get('latency') || 5),
    // Placeholder project used for the README screenshots (?demo=1).
    demo() {
      const h = 60 * min;
      host.state.workspace = 'webshop';
      host.state.groups = [
        { id: 'g-front', name: 'Webshop frontend', color: 'blue', collapsed: false, sessionIds: ['d1', 'd2', 'd3'] },
        { id: 'g-pay', name: 'Checkout', color: null, collapsed: false, parentId: 'g-front', sessionIds: ['d14', 'd15'] },
        { id: 'g-back', name: 'API & backend', color: 'green', collapsed: false, sessionIds: ['d4', 'd5'] },
        { id: 'g-bugs', name: 'Bug fixes', color: 'red', collapsed: false, sessionIds: ['d6', 'd7'] },
        { id: 'g-docs', name: 'Documentation', color: null, collapsed: true, sessionIds: ['d8'] },
        { id: 'g-idea', name: 'Ideas', color: 'purple', collapsed: true, sessionIds: ['d9', 'd10'] },
      ];
      host.state.sessions = [
        session('d1', 'Cart page redesign', 0.4 * min),
        session('d2', 'Fix the slow product filter', 3 * h),
        session('d3', 'Introduce dark mode', 26 * h),
        session('d4', 'Order API error handling', 50 * min),
        session('d5', 'Database migration v3', 4 * 24 * h, { worktree: true }),
        session('d6', 'Login bug in Safari', 2 * h),
        session('d7', 'Duplicate email notifications', 2 * 24 * h),
        session('d8', 'Update the API docs', 8 * 24 * h),
        session('d9', 'Coupon system plan', 12 * 24 * h),
        session('d10', 'Recommendation engine prototype', 20 * 24 * h),
        session('d11', 'Speed up the CI pipeline', 20 * min),
        session('d12', 'Update the README', 6 * h),
        session('d13', 'Improve test coverage', 3 * 24 * h),
        session('d14', 'Card payments (3DS)', 90 * min),
        session('d15', 'Coupon code in the cart', 30 * h),
      ];
    },
    // Many groups and sessions for performance testing: ?stress=<groups>x<per group>+<ungrouped>, e.g. 80x40+400.
    stress(spec) {
      // (A "+" in the query string arrives as a space.)
      const m = /^(\d+)x(\d+)(?:[+ ](\d+))?$/.exec(spec.trim()) || [];
      const groupCount = Number(m[1] || 80);
      const perGroup = Number(m[2] || 40);
      const loose = Number(m[3] || 400);
      const words = ['Kosár', 'oldal', 'újratervezése', 'Termékszűrő', 'lassúság', 'javítása', 'Dark', 'mode', 'Rendelés-API', 'hibakezelés',
        'Adatbázis', 'migráció', 'Bejelentkezési', 'hiba', 'értesítések', 'dokumentáció', 'Kuponrendszer', 'terv', 'Ajánlómotor', 'prototípus',
        'CI', 'pipeline', 'gyorsítása', 'README', 'frissítése', 'Tesztlefedettség', 'parser', 'unit', 'tesztek', 'refaktor'];
      const title = (n) => Array.from({ length: 3 + (n % 4) }, (_, k) => words[(n * 7 + k * 13) % words.length]).join(' ');
      const colors = [null, 'red', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink', 'gray'];
      host.state.groups = [];
      host.state.sessions = [];
      let n = 0;
      const add = () => {
        const id = `st${n}`;
        host.state.sessions.push(session(id, `${title(n)} #${n}`, ((n * 37) % 9000) * min, { prompt: n % 3 ? `kérés: ${title(n + 1)}` : undefined, worktree: n % 17 === 0 }));
        n++;
        return id;
      };
      for (let g = 0; g < groupCount; g++) {
        const sessionIds = Array.from({ length: perGroup }, add);
        host.state.groups.push({ id: `sg${g}`, name: `Csoport ${g + 1} – ${words[g % words.length]}`, color: colors[g % colors.length], collapsed: false, sessionIds });
      }
      for (let i = 0; i < loose; i++) add();
    },
    post() {
      window.postMessage(JSON.parse(JSON.stringify(Object.assign({ type: 'state', ack: host.ack }, host.state))), '*');
    },
    updateGroups(fn) {
      host.state.groups = fn(host.state.groups);
    },
    handle(m) {
      const known = (id) => host.state.sessions.some((s) => s.id === id);
      if (Number.isInteger(m.seq)) host.ack = m.seq;
      switch (m.type) {
        case 'ready': host.ack = 0; host.post(); break;
        case 'toggleGroup': host.updateGroups((g) => ops.setCollapsed(g, m.id, m.collapsed)); break;
        case 'toggleUngrouped': host.state.ungroupedCollapsed = m.collapsed; break;
        case 'moveGroup':
          host.updateGroups((g) => (m.parentId === undefined
            ? ops.moveGroupBefore(g, m.id, m.beforeId || null)
            : ops.moveGroup(g, m.id, { parentId: m.parentId || null, beforeId: m.beforeId || null })));
          break;
        case 'moveGroupBy': host.updateGroups((g) => ops.moveGroupBy(g, m.id, m.delta)); break;
        case 'moveSessions': host.updateGroups((g) => ops.assignSessions(g, m.ids, m.groupId || null, m.beforeId || null)); break;
        case 'moveSessionBy': host.updateGroups((g) => ops.moveSessionBy(g, m.id, m.delta, known)); break;
        case 'renameGroup': host.updateGroups((g) => ops.renameGroup(g, m.id, m.name)); break;
        case 'createGroup': {
          const id = `g-${Math.random().toString(36).slice(2, 8)}`;
          host.updateGroups((g) => ops.createGroup(g, { id, name: m.name, sessionIds: m.sessionIds || [], parentId: m.parentId || null }));
          window.postMessage({ type: 'focus', key: `g:${id}` }, '*');
          break;
        }
        case 'newSession': {
          // Simulates the Claude Code panel: the session shows up after the first message.
          host.state.pendingGroupId = m.groupId || null;
          host.post();
          setTimeout(() => {
            const id = `n${Date.now()}`;
            host.state.sessions.push(session(id, 'Új session a gombbal', 0));
            if (host.state.pendingGroupId) host.updateGroups((g) => ops.assignSessions(g, [id], host.state.pendingGroupId, null));
            host.state.pendingGroupId = null;
            host.post();
          }, 1500);
          break;
        }
        case 'cancelPending': host.state.pendingGroupId = null; host.post(); break;
        case 'deleteGroup': host.updateGroups((g) => ops.deleteGroup(g, m.id)); host.post(); break;
        default: break;
      }
      if (Number.isInteger(m.seq)) host.post();
    },
  };
  if (params.get('demo') === '1') host.demo();
  if (params.get('stress')) host.stress(params.get('stress'));
  window.host = host;
  window.acquireVsCodeApi = () => ({
    postMessage: (m) => { host.log.push(m); setTimeout(() => host.handle(m), host.latency); },
    getState: () => host.savedState,
    setState: (s) => { host.savedState = s; },
  });
</script>
<script>window.module = { exports: {} };</script>
<script src="../src/webviewStrings.js"></script>
<script>
  // The texts, as the extension passes them: English, or the Hungarian bundle with ?lang=hu.
  (function () {
    const lang = params.get('lang') === 'hu' ? 'hu' : 'en';
    let bundle = {};
    if (lang !== 'en') {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', `../l10n/bundle.l10n.${lang}.json`, false);
      xhr.send();
      if (xhr.status === 200) bundle = JSON.parse(xhr.responseText);
    }
    const t = (m) => (typeof bundle[m] === 'string' ? bundle[m] : m);
    const strings = window.module.exports.webviewStrings(t);
    document.body.dataset.l10n = JSON.stringify(Object.assign(strings, { lang, locale: lang === 'hu' ? 'hu-HU' : 'en-US' }));
  })();
</script>
<script src="../media/view.js"></script>
<script src="shots.js"></script>
<script src="bench.js"></script>
<script src="checks.js"></script>
</body>
</html>
